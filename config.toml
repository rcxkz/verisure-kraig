# Essex Lead Finder — configuration
# Edit towns, postcode districts and councils to change the patch.

[settings]
crime_months = 3            # how many of the latest police-data months to use
news_days = 14              # how far back to look for news stories
sales_months = 6            # how recent a house sale counts as a "new owner"
revisit_cooldown_days = 21  # hide streets/businesses visited within this window
top_streets = 40
top_businesses = 40
nearby_metres = 400         # "within a 5-minute walk" (~80m per minute)
user_agent = "essex-lead-finder/0.1 (personal sales research tool)"

# Towns are the search centres. The police API returns crimes within ~1 mile
# of each point, so add more points to cover bigger towns.
# `include = false` keeps a town in the file without searching it.
[[towns]]
name = "Tilbury"
lat = 51.4625
lng = 0.3586

