name: Daily leads

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC every day (5:17am GMT / 6:17am BST)
  workflow_dispatch:         # "Run workflow" button for a manual refresh

concurrency: daily-leads

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Keep the database between runs (crime cache, "NEW today" tracking, house-sale file)
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: leads-data-${{ github.run_id }}
          restore-keys: leads-data-

      - name: Fetch, score and build app
        run: python -m leadfinder run
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: leads-data-${{ github.run_id }}

      - name: Include today's full report
        run: cp output/$(date +%F)/report.html output/site/report.html

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create verisure-kraig --production-branch main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy output/site --project-name verisure-kraig --branch main --commit-dirty=true
